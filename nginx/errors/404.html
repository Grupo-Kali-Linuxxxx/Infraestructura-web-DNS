<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Recurso no disponible</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #eef3f8; color: #172e46; font: 17px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 660px); padding: clamp(24px, 5vw, 48px); background: white;
      border-top: 6px solid #276aab; border-radius: 12px; box-shadow: 0 16px 45px #172e4612; }
    .label { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .code { margin: 12px 0 0; color: #276aab; font-size: 76px; font-weight: 750; line-height: 1.1; }
    h1 { margin: 16px 0; font-size: 28px; line-height: 1.3; }
    p { margin: 12px 0 24px; }
    a { display: inline-block; border-radius: 6px; padding: 10px 20px; background: #205d96;
      color: white; font-weight: 600; text-decoration: none; }
    a:hover { background: #173f65; }
    a:focus-visible { outline: 3px solid #172e46; outline-offset: 4px; }
    footer { margin-top: 28px; color: #51677d; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <p class="label">Infraestructura Web DNS</p>
    <div class="code" aria-hidden="true">404</div>
    <h1>Recurso no disponible</h1>
    <p>El recurso solicitado no está disponible. Comprueba la dirección o vuelve a la página de inicio.</p>
    <a href="/">Volver al inicio</a>
    <footer>Error HTTP 404 · Proyecto académico</footer>
  </main>
</body>
</html>
