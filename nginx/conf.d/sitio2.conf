server {
    listen 80;
    server_name sitio2.local;
    access_log /var/log/nginx/sitio2_access.log laboratorio;
    access_log /dev/stdout laboratorio;
    error_log /var/log/nginx/sitio2_error.log warn;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend app2:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    location / { proxy_pass http://$backend; proxy_intercept_errors on; }
    location /api/ { proxy_pass http://$backend; proxy_intercept_errors off; }
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { root /usr/share/nginx/html/errors; internal; }
    location = /50x.html { root /usr/share/nginx/html/errors; internal; }
}
