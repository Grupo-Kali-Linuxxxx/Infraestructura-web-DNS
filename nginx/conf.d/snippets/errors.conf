# Incluir dentro de cada bloque server. No cambiar el código HTTP original.
error_page 404 /errors/404.html;
error_page 502 /errors/502.html;

location = /errors/404.html {
    internal;
    root /usr/share/nginx/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
}

location = /errors/502.html {
    internal;
    root /usr/share/nginx/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
}

# Reservar este prefijo a Nginx; no enviarlo al backend.
location ^~ /errors/ {
    return 404;
}
