server {
    listen 80;
    server_name sitio1.local;
    include /etc/nginx/conf.d/snippets/errors.conf;

    access_log /var/log/nginx/sitio1_access.log infraestructura;
    access_log /dev/stdout infraestructura;
    error_log /var/log/nginx/sitio1_error.log warn;
    error_log /dev/stderr warn;

    # Los errores API conservan su cuerpo JSON, incluidas las respuestas 404.
    location ^~ /api/ {
        proxy_pass http://app1:3000;
        proxy_intercept_errors off;
        include /etc/nginx/conf.d/snippets/proxy-headers.conf;
    }

    location / {
        proxy_pass http://app1:3000;
        proxy_intercept_errors on;
        include /etc/nginx/conf.d/snippets/proxy-headers.conf;
    }
}
