services:
  nginx:
    image: nginx:alpine
    container_name: web-nginx
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/errors:/usr/share/nginx/html/errors:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app1: {condition: service_healthy}
      app2: {condition: service_healthy}
    networks: [web_network]
  app1:
    build: ./backend/app1
    container_name: backend-app1
    environment: {APP_NAME: "App 1", COOKIE_NAME: app1.sid}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [web_network]
  app2:
    build: ./backend/app2
    container_name: backend-app2
    environment: {APP_NAME: "App 2", COOKIE_NAME: app2.sid}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [web_network]
  ubuntu-server:
    build: ./ubuntu-server
    container_name: ubuntu-server
    privileged: true
    tmpfs: [/run, /run/lock, /tmp]
    command: ["/lib/systemd/systemd"]
    networks: [web_network]
networks:
  web_network: {driver: bridge}
volumes:
  nginx_logs:
