services:

  nginx:
    image: nginx:alpine
    container_name: web-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/errors:/usr/share/nginx/html/errors:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - web_network

  app1:
    build:
      context: ./backend/app1
    container_name: backend-app1
    environment:
      SESSION_SECRET: ${APP1_SESSION_SECRET:?Ejecuta scripts/Initialize-Environment.ps1 para crear .env}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "3000"
    networks:
      - web_network

  app2:
    build:
      context: ./backend/app2
    container_name: backend-app2
    environment:
      SESSION_SECRET: ${APP2_SESSION_SECRET:?Ejecuta scripts/Initialize-Environment.ps1 para crear .env}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "3000"
    networks:
      - web_network

  ubuntu-server:
    build:
      context: ./ubuntu-server
    container_name: ubuntu-server
    hostname: ubuntu-server
    # Laboratorio systemd en Docker Desktop; no usar privileged en producción.
    privileged: true
    stdin_open: true
    tty: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    command: ["/lib/systemd/systemd"]
    stop_signal: SIGRTMIN+3
    healthcheck:
      test: ["CMD", "systemctl", "is-active", "--quiet", "lab-demo.service"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - web_network

networks:
  web_network:
    driver: bridge
