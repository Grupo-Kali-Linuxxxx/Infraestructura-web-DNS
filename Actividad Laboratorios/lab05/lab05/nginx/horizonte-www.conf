# /etc/nginx/sites-available/horizonte-www.conf — Sitio institucional con HTTPS
# Puerto 80: solo redirige a https (nada se sirve sin cifrar)
server {
    listen 80;
    listen [::]:80;
    server_name www.horizonte.internal horizonte.internal;
    access_log /var/log/nginx/horizonte-www.access.log horizonte;
    # TODO: redirigir TODO a https://www.horizonte.internal conservando la ruta
    root /srv/horizonte/www;
}

# horizonte.internal con https → www (necesita el certificado para poder redirigir)
server {
    listen 443 ssl http2;            # Nginx 1.24: http2 va en listen (la directiva 'http2 on;' es de 1.25.1+)
    listen [::]:443 ssl http2;
    server_name horizonte.internal;
    include snippets/horizonte-tls.conf;
    return 301 https://www.horizonte.internal$request_uri;
}

server {
    listen 443 ssl http2;            # Nginx 1.24: http2 va en listen (la directiva 'http2 on;' es de 1.25.1+)
    listen [::]:443 ssl http2;
    server_name www.horizonte.internal;

    include snippets/horizonte-tls.conf;
    include snippets/horizonte-cabeceras.conf;

    root  /srv/horizonte/www;
    index index.html;

    access_log /var/log/nginx/horizonte-www.access.log horizonte;
    error_log  /var/log/nginx/horizonte-www.error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 7d;
        access_log off;
    }

    location /circulares/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        # Esta location tiene su propio add_header → pierde los del server. Por eso se vuelve a incluir el snippet.
        add_header X-Robots-Tag "noindex" always;
        # TODO: esta location tiene su propio add_header… ¿qué pasa con HSTS y la CSP aquí? Arréglalo
    }

    # La CA pública del colegio se descarga como archivo (para instalarla en las PCs)
    location = /horizonte-ca.crt {
        default_type application/x-x509-ca-cert;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { internal; }
    location = /50x.html { internal; }
}
