# /etc/nginx/snippets/horizonte-tls.conf — TLS moderno compartido por los sitios del colegio
ssl_certificate     /etc/nginx/tls/horizonte.crt;    # certificado + cadena
ssl_certificate_key /etc/nginx/tls/horizonte.key;

ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;         # TODO: deja solo las versiones seguras (RFC 8996)
ssl_prefer_server_ciphers off;                       # con TLS 1.3 el cliente elige bien
ssl_session_cache   shared:TLS_HORIZONTE:10m;        # reanudar sesiones: menos trabajo por visita
ssl_session_timeout 1d;
ssl_session_tickets off;
