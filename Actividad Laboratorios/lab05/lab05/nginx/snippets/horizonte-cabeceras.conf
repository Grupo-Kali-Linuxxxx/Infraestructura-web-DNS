# /etc/nginx/snippets/horizonte-cabeceras.conf — Cabeceras de seguridad (se incluyen en cada server HTTPS)
# ¡Ojo! Si una location tiene su propio add_header, NO hereda estas: hay que volver a incluir el snippet ahí.

# HSTS: el navegador usará SIEMPRE https durante 1 año (empieza con valores bajos en producción)
# TODO: HSTS de 1 año (31536000 segundos) con "always"
# No adivinar tipos de archivo (un .txt no se ejecuta como script)
add_header X-Content-Type-Options "nosniff" always;
# Nadie puede meter nuestro sitio en un iframe (clickjacking)
add_header X-Frame-Options "DENY" always;
# Al salir hacia otro sitio, solo se informa el dominio, no la ruta completa
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# El sitio no usa cámara, micrófono ni ubicación
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: solo recursos propios; sin scripts en línea; formularios solo hacia nosotros
# TODO: Content-Security-Policy: todo desde 'self'; imágenes también data:; estilos 'self' 'unsafe-inline';
#       scripts 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'
