# /etc/nginx/sites-available/horizonte-portal.conf — Portal para padres con HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name portal.horizonte.internal;
    access_log /var/log/nginx/horizonte-portal.access.log horizonte;
    return 301 https://portal.horizonte.internal$request_uri;
}

server {
    listen 443 ssl http2;            # Nginx 1.24: http2 va en listen (la directiva 'http2 on;' es de 1.25.1+)
    listen [::]:443 ssl http2;
    server_name portal.horizonte.internal;

    # TODO: incluir los dos snippets (TLS y cabeceras)

    root  /srv/horizonte/portal/public;
    index index.php;

    access_log /var/log/nginx/horizonte-portal.access.log horizonte;
    error_log  /var/log/nginx/horizonte-portal.error.log warn;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ =404;
    }

    # fastcgi-php.conf incluye fastcgi.conf, que envía HTTPS=on a PHP: la cookie de sesión pasa a ser Secure
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    location ~ /\. {
        deny all;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /srv/horizonte/www;
        internal;
    }
}
