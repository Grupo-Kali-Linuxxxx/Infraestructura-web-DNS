# /etc/nginx/sites-available/00-rechazar-desconocidos.conf
# Nombres desconocidos o acceso por IP: en 80 se cierra la conexión (444); en 443 se rechaza el saludo TLS
# sin mostrar nuestro certificado (así un escáner no descubre qué dominios servimos).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/desconocidos.access.log;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # TODO: rechazar el saludo TLS sin mostrar ningún certificado (pista: ssl_reject_…)
}
