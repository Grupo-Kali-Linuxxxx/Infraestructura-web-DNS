# /etc/nginx/sites-available/horizonte-www.conf — Sitio institucional de la U.E. Horizonte
# Completa los TODO. Después de cada cambio:  sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name www.horizonte.internal horizonte.internal;

    root  /srv/horizonte/www;
    index index.html;

    # Registros propios del sitio (formato 'horizonte' definido en conf.d/horizonte-log.conf)
    access_log /var/log/nginx/horizonte-www.access.log horizonte;
    # TODO: error_log propio en /var/log/nginx/horizonte-www.error.log con nivel warn

    # TODO: si $host es horizonte.internal (sin www), redirigir 301 a http://www.horizonte.internal$request_uri
    #       (pista: if ($host = ...) { return 301 ...; })

    location / {
        try_files $uri $uri/ =404;
    }

    # TODO: location para css, js e imágenes con "expires 7d;" y sin access_log
    #       (pista: location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ { ... })

    # TODO: location /circulares/ con autoindex activado (tamaños legibles y hora local)

    # Archivos ocultos (.git, .env…) nunca se publican
    location ~ /\. {
        deny all;
    }

    # TODO: páginas de error propias: 404 → /404.html ; 500 502 503 504 → /50x.html
    #       y que esas páginas solo se puedan ver como error (location = /404.html { internal; })
}
