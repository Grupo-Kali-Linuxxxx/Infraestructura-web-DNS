# /etc/nginx/sites-available/horizonte-portal.conf — Portal para padres: PHP-FPM + API por proxy inverso
server {
    listen 80;
    listen [::]:80;
    server_name portal.horizonte.internal;

    # Solo la carpeta public/ es visible desde la web; app/ (código y datos) queda fuera
    # TODO: root a la carpeta public/ del portal (NO a /srv/horizonte/portal) e index index.php
    root  /srv/horizonte/portal;
    index index.html;

    access_log /var/log/nginx/horizonte-portal.access.log horizonte;
    error_log  /var/log/nginx/horizonte-portal.error.log warn;

    client_max_body_size 2m;                 # formularios pequeños; frena envíos gigantes

    location / {
        try_files $uri $uri/ =404;
    }

    # 1) FastCGI: Nginx pasa los .php a PHP-FPM por un socket Unix
    # TODO: location para los archivos .php que incluya snippets/fastcgi-php.conf y
    #       los pase por fastcgi_pass al socket unix:/run/php/php8.3-fpm.sock

    # 2) Proxy inverso HTTP: /api/ lo atiende otro programa (servicio horizonte-eco en 127.0.0.1:8081)
    # TODO: location /api/ con proxy_pass a http://127.0.0.1:8081/ (¿qué hace la barra final?)
    #       y las cabeceras Host, X-Real-IP, X-Forwarded-For y X-Forwarded-Proto
    #       (pista: proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;)

    location ~ /\. {
        deny all;
    }

    # Si PHP-FPM o la API se caen (502/504), el padre ve la página de mantenimiento, no un error técnico
    # TODO: error_page 502 503 504 → /50x.html, tomada de /srv/horizonte/www (location = /50x.html { root …; internal; })
}
